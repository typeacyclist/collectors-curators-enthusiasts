<title>Orchid Enthusiasts — MVP Screen Mockups</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* ---------- viewer chrome (theme-aware) ---------- */
:root{
  --c-bg:#F2F0EB; --c-panel:#FFFFFF; --c-ink:#26302A; --c-mut:#6C7A6E;
  --c-line:#DDDAD2; --c-acc:#3D5A3C; --c-acc2:#A64D79;
}
@media (prefers-color-scheme: dark){
  :root{ --c-bg:#191D1A; --c-panel:#222723; --c-ink:#E8EAE4; --c-mut:#93A095;
         --c-line:#333A34; --c-acc:#9DB89A; --c-acc2:#D191B4; }
}
:root[data-theme="dark"]{ --c-bg:#191D1A; --c-panel:#222723; --c-ink:#E8EAE4; --c-mut:#93A095;
         --c-line:#333A34; --c-acc:#9DB89A; --c-acc2:#D191B4; }
:root[data-theme="light"]{ --c-bg:#F2F0EB; --c-panel:#FFFFFF; --c-ink:#26302A; --c-mut:#6C7A6E;
         --c-line:#DDDAD2; --c-acc:#3D5A3C; --c-acc2:#A64D79; }

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--c-bg);color:var(--c-ink);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{display:flex;gap:28px;max-width:1200px;margin:0 auto;padding:24px 20px 60px;align-items:flex-start}
.rail{width:280px;flex:0 0 auto;position:sticky;top:20px;max-height:calc(100vh - 40px);overflow-y:auto;
  background:var(--c-panel);border:1px solid var(--c-line);border-radius:14px;padding:18px 14px}
.rail h1{font:700 19px/1.25 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;margin:0 0 2px;color:var(--c-acc)}
.rail .sub{font-size:12.5px;color:var(--c-mut);margin:0 0 14px}
.rail h2{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--c-mut);margin:16px 4px 6px}
.rail button{display:flex;width:100%;text-align:left;background:none;border:0;border-radius:8px;
  padding:7px 10px;font:inherit;font-size:13.5px;color:var(--c-ink);cursor:pointer;gap:8px;align-items:baseline}
.rail button:hover{background:var(--c-bg)}
.rail button.on{background:var(--c-acc);color:#fff}
.rail button .n{font-size:10.5px;color:var(--c-mut);font-variant-numeric:tabular-nums;min-width:18px}
.rail button.on .n{color:rgba(255,255,255,.7)}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;gap:14px;min-width:0}
.hint{font-size:12.5px;color:var(--c-mut);text-align:center;max-width:420px}
.hint b{color:var(--c-ink)}
kbd{border:1px solid var(--c-line);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:11px;background:var(--c-panel)}
@media (max-width:860px){ .wrap{flex-direction:column;align-items:center} .rail{position:static;width:100%;max-height:240px} }

/* ---------- phone frame ---------- */
.phone{width:400px;max-width:100%;height:822px;border-radius:46px;border:11px solid #171A17;
  background:#FAF8F4;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(20,30,20,.28);flex:0 0 auto}
.sbar{height:42px;flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;
  padding:0 24px;font-size:13px;font-weight:600;color:#26302A;background:#FAF8F4}
.sbar .pill-notch{width:110px;height:26px;background:#171A17;border-radius:14px;margin:0 auto;position:absolute;left:0;right:0;top:18px}
.phone{position:relative}
#screen{flex:1;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;background:#FAF8F4}
#tabbar{flex:0 0 auto}

/* ---------- app design system (deliberately light: greenhouse daylight) ---------- */
.app{--paper:#FAF8F4;--card:#FFFFFF;--ink:#26302A;--mut:#66735F;--line:#E4E0D6;
  --moss:#3D5A3C;--moss-soft:#E7EDE4;--orchid:#A64D79;--orchid-soft:#F5E7EE;
  --quar:#B07C2F;--quar-soft:#F5EBDA;--sale:#2F6B8A;--sale-soft:#E2EEF3;--danger:#A63D3D;--danger-soft:#F5E2E2;
  color:var(--ink);font-size:16px;line-height:1.45;display:flex;flex-direction:column;min-height:100%}
.app .serif{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
.app .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}

.hdr{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;padding:12px 16px;min-height:56px}
.hdr .back{border:0;background:none;font-size:22px;line-height:1;color:var(--moss);cursor:pointer;padding:6px 8px;margin-left:-8px;border-radius:8px}
.hdr .back:hover{background:var(--moss-soft)}
.hdr h1{font-family:inherit;font-size:18px;line-height:1.25;font-weight:600;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .hact{border:0;background:none;color:var(--moss);font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;padding:6px 8px;border-radius:8px}
.body{padding:16px;display:flex;flex-direction:column;gap:14px}
.pad-b{padding-bottom:28px}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.card h3{margin:0 0 8px;font-size:15px}
.tight{padding:6px 16px}
.muted{color:var(--mut)} .small{font-size:13.5px} .xs{font-size:12.5px}
.center{text-align:center}
.row{display:flex;align-items:center;gap:12px}
.row .grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}
.hr{border:0;border-top:1px solid var(--line);margin:2px 0}

.btn{display:flex;justify-content:center;align-items:center;gap:8px;width:100%;min-height:48px;border-radius:12px;
  font-family:inherit;font-size:16px;font-weight:600;cursor:pointer;border:1.5px solid transparent;padding:10px 16px;text-align:center}
.btn.primary{background:var(--moss);color:#fff}
.btn.accent{background:var(--orchid);color:#fff}
.btn.quiet{background:var(--card);border-color:var(--line);color:var(--ink)}
.btn.ghost{background:none;color:var(--moss)}
.btn.danger{background:none;border-color:var(--danger);color:var(--danger)}
.btn.sm{min-height:40px;font-size:14.5px;width:auto;padding:6px 14px}
.btnrow{display:flex;gap:10px}
.btnrow .btn{flex:1}

.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:600}
.b-active{background:var(--moss-soft);color:var(--moss)}
.b-quar{background:var(--quar-soft);color:var(--quar)}
.b-sale{background:var(--sale-soft);color:var(--sale)}
.b-arch{background:#ECEAE3;color:#7A7668}
.b-review{background:var(--orchid-soft);color:var(--orchid)}
.b-res{background:var(--sale-soft);color:var(--sale)}
.src{display:inline-block;border-radius:5px;padding:1px 7px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.s-user{background:var(--moss-soft);color:var(--moss)}
.s-label{background:var(--sale-soft);color:var(--sale)}
.s-ai{background:var(--orchid-soft);color:var(--orchid)}
.s-unk{background:#ECEAE3;color:#7A7668}

.ph{border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;flex:0 0 auto}
.ph svg{width:46%;height:46%;opacity:.85}
.ph.g1{background:linear-gradient(140deg,#5C7B54,#33492F)}
.ph.g2{background:linear-gradient(140deg,#A64D79,#5E2B46)}
.ph.g3{background:linear-gradient(140deg,#B07C2F,#6E4C1B)}
.ph.g4{background:linear-gradient(140deg,#2F6B8A,#1C3F53)}
.ph.g5{background:linear-gradient(140deg,#7D6B9E,#453A5C)}
.ph.g6{background:linear-gradient(140deg,#4E8578,#2A4A42)}

.lrow{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:12px 14px;cursor:pointer}
.lrow:hover{border-color:var(--moss)}
.lrow .ph{width:56px;height:56px}
.lrow h4{margin:0;font-size:15.5px}
.lrow .sub{font-size:13px;color:var(--mut)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chip{flex:0 0 auto;border:1.5px solid var(--line);background:var(--card);border-radius:999px;
  padding:7px 14px;font-family:inherit;font-size:13.5px;font-weight:600;color:var(--ink);cursor:pointer}
.chip.on{background:var(--moss);border-color:var(--moss);color:#fff}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13.5px;font-weight:600}
.field input,.field textarea,.field select{font-family:inherit;font-size:16px;color:var(--ink);background:var(--card);
  border:1.5px solid var(--line);border-radius:10px;padding:12px;width:100%}
.field textarea{min-height:110px;resize:none}
.field .note{font-size:12.5px;color:var(--mut)}

.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.metric{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer}
.metric .v{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.metric .l{font-size:12.5px;color:var(--mut)}
.metric.warn .v{color:var(--quar)} .metric.rev .v{color:var(--orchid)} .metric.sale .v{color:var(--sale)}

.steps{display:flex;gap:5px;padding:12px 16px 0}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--orchid)}
.qbig{font:600 22px/1.3 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;margin:4px 0 2px}

.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);padding:0 8px;background:var(--paper);position:sticky;top:56px;z-index:4}
.tabs button{flex:0 0 auto;border:0;background:none;font-family:inherit;font-size:14px;font-weight:600;color:var(--mut);
  padding:11px 11px;border-bottom:2.5px solid transparent;cursor:pointer}
.tabs button.on{color:var(--moss);border-bottom-color:var(--orchid)}

.tl{display:flex;flex-direction:column}
.tl .ev{display:flex;gap:12px;padding:10px 0}
.tl .ev + .ev{border-top:1px solid var(--line)}
.tl .dot{width:10px;height:10px;border-radius:50%;background:var(--moss);margin-top:6px;flex:0 0 auto}
.tl .dot.q{background:var(--quar)} .tl .dot.o{background:var(--orchid)} .tl .dot.s{background:var(--sale)}
.tl .when{font-size:12.5px;color:var(--mut)}
.tl h5{margin:0;font-size:15px}

.tabbar{display:flex;border-top:1px solid #E4E0D6;background:#FFFFFF;padding:6px 4px 14px}
.tabbar button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;
  font-family:inherit;font-size:10.5px;font-weight:600;color:#66735F;cursor:pointer;padding:4px 0}
.tabbar button.on{color:#3D5A3C}
.tabbar .ico{font-size:21px;line-height:1}
.tabbar .addbtn .ico{width:44px;height:44px;border-radius:50%;background:#A64D79;color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:26px;margin-top:-18px;box-shadow:0 4px 10px rgba(166,77,121,.4)}

.label-prev{background:#fff;border:1.5px dashed var(--mut);border-radius:6px;padding:14px;display:flex;gap:12px;align-items:center;justify-content:space-between}
.label-prev .nm{font:600 15px/1.3 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
.qr{width:74px;height:74px;flex:0 0 auto;background:
  repeating-linear-gradient(0deg,#26302A 0 4px,transparent 4px 8px),
  repeating-linear-gradient(90deg,#26302A 0 4px,#fff 4px 8px);border:4px solid #fff;outline:1.5px solid #26302A}
.qr.sm{width:54px;height:54px}

.finder{position:relative;background:linear-gradient(160deg,#20291F,#0F140F);border-radius:14px;height:300px;
  display:flex;align-items:center;justify-content:center;overflow:hidden}
.finder .frame{width:180px;height:180px;border-radius:18px;border:3px solid rgba(255,255,255,.9);
  box-shadow:0 0 0 2000px rgba(0,0,0,.35)}
.finder .scanline{position:absolute;width:180px;height:2.5px;background:var(--orchid);opacity:.9;animation:scan 2.2s ease-in-out infinite}
@keyframes scan{0%,100%{transform:translateY(-80px)}50%{transform:translateY(80px)}}
@media (prefers-reduced-motion: reduce){.finder .scanline{animation:none}}

.tree{font-size:15px}
.tree ul{list-style:none;margin:0;padding-left:20px;border-left:1.5px solid var(--line)}
.tree > ul{padding-left:0;border-left:0}
.tree li{padding:7px 0 0}
.tree .nd{display:flex;align-items:center;gap:8px}
.tree .cnt{margin-left:auto;font-size:12.5px;color:var(--mut);font-variant-numeric:tabular-nums}
.tree .ic{font-size:15px}

.aic{border-left:3px solid var(--orchid);background:var(--card);border-radius:0 12px 12px 0;padding:12px 14px}
.notice{display:flex;gap:10px;background:var(--quar-soft);border-radius:12px;padding:12px 14px;font-size:14px}
.notice.info{background:var(--sale-soft)}
.notice.ok{background:var(--moss-soft)}
.share-opt{display:flex;gap:12px;align-items:flex-start;padding:12px 4px;cursor:pointer}
.share-opt + .share-opt{border-top:1px solid var(--line)}
.radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--mut);flex:0 0 auto;margin-top:2px}
.radio.on{border-color:var(--orchid);box-shadow:inset 0 0 0 5px var(--orchid)}
.check{width:22px;height:22px;border-radius:6px;border:2px solid var(--mut);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff}
.check.on{background:var(--moss);border-color:var(--moss)}
.legend{display:flex;flex-wrap:wrap;gap:8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14.5px}
.kv dt{color:var(--mut)} .kv dd{margin:0}
.wordmark{font:700 26px/1.15 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;color:var(--moss)}
.wordmark .dot{color:var(--orchid)}
a.lk{color:var(--moss);font-weight:600;text-decoration:none;cursor:pointer}
</style>

<div class="wrap">
  <aside class="rail" id="rail">
    <h1>Orchid Enthusiasts<span style="color:var(--c-acc2)">.</span></h1>
    <p class="sub">High-fidelity MVP screen mockups · every screen in the MVP Definition §19, plus required states</p>
  </aside>
  <main class="stage">
    <div class="phone">
      <div class="pill-notch"></div>
      <div class="sbar"><span>9:41</span><span>🌤 68°F &nbsp;📶 ▂▄▆ 🔋</span></div>
      <div id="screen"></div>
      <div id="tabbar"></div>
    </div>
    <p class="hint">Click any screen in the index, or navigate <b>inside the phone</b> — buttons, tabs, rows, and the tab bar are wired. <kbd>←</kbd> <kbd>→</kbd> step through screens.</p>
  </main>
</div>

<script>
/* ================= sample data ================= */
const flower = (op=".85") => `<svg viewBox="0 0 100 100" aria-hidden="true" style="opacity:${op}">
  <g fill="currentColor">
    <ellipse cx="50" cy="26" rx="12" ry="20"/>
    <ellipse cx="50" cy="74" rx="12" ry="20" transform="rotate(180 50 74)"/>
    <ellipse cx="26" cy="50" rx="20" ry="12"/>
    <ellipse cx="74" cy="50" rx="20" ry="12"/>
    <circle cx="50" cy="50" r="11" fill="#FAF8F4" opacity=".9"/>
    <circle cx="50" cy="50" r="5"/>
  </g></svg>`;

const ORCHIDS = [
 {id:"o1", name:"Cymbidium Golden Elf ‘Sundust’", acc:"PCO-2026-0001", status:"ACTIVE", badge:"b-active", slabel:"Active",
  loc:"Rack 1 / Shelf 2", coll:"Main Orchid Collection", ph:"g1", note:"Identification needs confirmation",
  last:"Added July 30, 2026"},
 {id:"o2", name:"Phalaenopsis ‘Moonlit Peak’", acc:"PCO-2026-0002", status:"ACTIVE", badge:"b-active", slabel:"Active",
  loc:"Rack 2 / Shelf 1", coll:"Main Orchid Collection", ph:"g5", note:"", last:"Watered Aug 2, 2026"},
 {id:"o3", name:"Paphiopedilum Maudiae", acc:"PCO-2026-0007", status:"QUARANTINE", badge:"b-quar", slabel:"Quarantine",
  loc:"Quarantine Rack", coll:"Quarantine", ph:"g6", note:"In quarantine 34 days", last:"Inspected Jul 28, 2026"},
 {id:"o4", name:"Cattleya Chocolate Drop ‘Kodama’", acc:"PCO-2026-0012", status:"FOR_SALE", badge:"b-sale", slabel:"For Sale",
  loc:"Display Rack", coll:"For Sale", ph:"g2", note:"Listed at $65", last:"Listed Aug 1, 2026"},
 {id:"o5", name:"Oncidium Twinkle (unconfirmed)", acc:"PCO-2026-0015", status:"ACTIVE", badge:"b-review", slabel:"Needs review",
  loc:"Main Growing Area", coll:"Oakland Acquisition", ph:"g3", note:"AI summary awaiting your review", last:"Added Aug 4, 2026"},
 {id:"o6", name:"Dendrobium kingianum", acc:"PCO-2025-0141", status:"ARCHIVED", badge:"b-arch", slabel:"Archived",
  loc:"—", coll:"Main Orchid Collection", ph:"g4", note:"Archived Jan 2026 (gifted)", last:"Archived Jan 12, 2026"},
];
const O = ORCHIDS[0];

/* ================= tiny component helpers ================= */
const go = id => { location.hash = id; };
const hdr = (title, back, act) => `
  <header class="hdr">
    ${back?`<button class="back" onclick="go('${back}')" aria-label="Back">‹</button>`:""}
    <h1>${title}</h1>${act||""}
  </header>`;
const phimg = (cls,size=56) => `<div class="ph ${cls}" style="width:${size}px;height:${size}px">${flower()}</div>`;
const orow = o => `
  <div class="lrow" onclick="go('detail-overview')">
    ${phimg(o.ph)}
    <div class="grow">
      <h4 class="serif">${o.name}</h4>
      <div class="sub"><span class="mono">${o.acc}</span> · ${o.loc}</div>
      ${o.note?`<div class="sub" style="color:var(--orchid)">${o.note}</div>`:""}
    </div>
    <span class="badge ${o.badge}">${o.slabel}</span>
  </div>`;
const steps = n => `<div class="steps">${[1,2,3,4,5,6,7].map(i=>`<i class="${i<=n?'on':''}"></i>`).join("")}</div>`;

/* ================= screens ================= */
const S = [];
const def = (id, group, title, render, tab) => S.push({id, group, title, render, tab});

/* ---------- PUBLIC & ACCOUNT ---------- */
def("pub-home","Public & account","Home (invite-only)", () => `
  ${""}
  <div class="body pad-b" style="gap:18px">
    <div class="center" style="padding-top:26px">
      <div style="width:84px;height:84px;margin:0 auto 10px;border-radius:50%;background:var(--moss-soft);display:flex;align-items:center;justify-content:center;color:var(--moss)">${flower("1")}</div>
      <div class="wordmark">Orchid Enthusiasts<span class="dot">.</span></div>
      <p class="serif" style="font-size:19px;margin:10px 0 0">Every orchid has a story.<br>Keep yours — and find it again.</p>
      <p class="muted small" style="margin:8px 0 0">Photograph a plant, tell its story in your own words, print a label, and scan it any time. Private by default.</p>
    </div>
    <button class="btn primary" onclick="go('pub-signin')">Sign in</button>
    <div class="card">
      <h3>Orchid Enthusiasts is in a private pilot</h3>
      <p class="small muted" style="margin:0 0 10px">Creating an account currently requires an invitation. Leave your email and we’ll write when a spot opens.</p>
      <div class="field"><input type="email" placeholder="you@example.com" aria-label="Email address"></div>
      <div class="field" style="margin-top:8px"><input placeholder="Tell us about your collection (optional)"></div>
      <button class="btn accent" style="margin-top:10px">Join the waitlist</button>
    </div>
    <p class="xs muted center"><a class="lk" onclick="go('pub-terms')">Terms of Service</a> · <a class="lk" onclick="go('pub-privacy')">Privacy Policy</a></p>
  </div>`);

def("pub-signin","Public & account","Sign in", () => `
  ${hdr("Sign in","pub-home")}
  <div class="body pad-b">
    <div class="center" style="padding:10px 0 2px"><div class="wordmark" style="font-size:22px">Orchid Enthusiasts<span class="dot">.</span></div></div>
    <div class="field"><label>Email</label><input type="email" value="rosa@pco-orchids.org"></div>
    <div class="field"><label>Password</label><input type="password" value="••••••••••"></div>
    <button class="btn primary" onclick="go('dashboard')">Sign in</button>
    <button class="btn ghost" onclick="go('pub-forgot')">Forgot your password?</button>
    <hr class="hr">
    <p class="small muted center">Have an invitation? <a class="lk" onclick="go('pub-create')">Create your account</a></p>
  </div>`);

def("pub-create","Public & account","Create account (invited)", () => `
  ${hdr("Create account","pub-signin")}
  <div class="body pad-b">
    <div class="notice ok"><span>✉️</span><div><b>You’re invited.</b><br><span class="small">Pat Okafor invited you to join <b>Pat’s Coastal Orchids</b> as an <b>Editor</b>. This invitation expires in 6 days.</span></div></div>
    <div class="field"><label>Your name</label><input value="Rosa Vance"></div>
    <div class="field"><label>Email</label><input type="email" value="rosa@pco-orchids.org"><span class="note">We’ll send a verification link before you can join the collection.</span></div>
    <div class="field"><label>Password</label><input type="password" placeholder="At least 10 characters"></div>
    <button class="btn primary">Create account</button>
    <p class="xs muted">By continuing you confirm you are 18 or older and agree to the <a class="lk" onclick="go('pub-terms')">Terms</a> and <a class="lk" onclick="go('pub-privacy')">Privacy Policy</a>.</p>
  </div>`);

def("pub-create-no","Public & account","Create account (no invite)", () => `

/* ================= chrome: rail, tabbar, router ================= */
const groups = [...new Set(S.map(s=>s.group))];
const rail = document.getElementById("rail");
groups.forEach(g=>{
  const h = document.createElement("h2"); h.textContent = g; rail.appendChild(h);
  S.filter(s=>s.group===g).forEach(s=>{
    const b = document.createElement("button");
    b.id = "rb-"+s.id;
    b.innerHTML = `<span class="n">${String(S.indexOf(s)+1).padStart(2,"0")}</span><span>${s.title}</span>`;
    b.onclick = ()=>go(s.id);
    rail.appendChild(b);
  });
});

const TABBAR = `
  <div class="tabbar">
    <button data-t="dashboard" onclick="go('dashboard')"><span class="ico">⌂</span>Home</button>
    <button data-t="orchid-list" onclick="go('orchid-list')"><span class="ico">🌿</span>Orchids</button>
    <button class="addbtn" onclick="go('add-1')"><span class="ico">＋</span>Add</button>
    <button data-t="scan" onclick="go('scan')"><span class="ico">▣</span>Scan</button>
    <button data-t="search" onclick="go('search')"><span class="ico">🔍</span>Search</button>
  </div>`;

function render(){
  const id = (location.hash||"#pub-home").slice(1);
  const s = S.find(x=>x.id===id) || S[0];
  const scr = document.getElementById("screen");
  scr.innerHTML = `<div class="app">${s.render()}</div>`;
  scr.scrollTop = 0;
  document.getElementById("tabbar").innerHTML = s.tab ? TABBAR : "";
  document.querySelectorAll("#tabbar [data-t]").forEach(b=>{
    b.classList.toggle("on", b.dataset.t===s.id ||
      (b.dataset.t==="orchid-list" && s.id.startsWith("detail")));
  });
  document.querySelectorAll(".rail button").forEach(b=>b.classList.toggle("on", b.id==="rb-"+s.id));
  const on = document.getElementById("rb-"+s.id);
  if(on) on.scrollIntoView({block:"nearest"});
}
addEventListener("hashchange", render);
addEventListener("keydown", e=>{
  if(e.key!=="ArrowRight" && e.key!=="ArrowLeft") return;
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) return;
  const id = (location.hash||"#pub-home").slice(1);
  let i = S.findIndex(x=>x.id===id); if(i<0) i=0;
  i = (i + (e.key==="ArrowRight"?1:-1) + S.length) % S.length;
  go(S[i].id);
});
render();
</script>
