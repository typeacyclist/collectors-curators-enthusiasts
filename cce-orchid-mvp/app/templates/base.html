<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#00827C">
  <title>{% block title %}Orchid Enthusiasts{% endblock %}</title>
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/app">Orchid Enthusiasts</a>
    {% if context and context.user %}
    <div class="topbar-actions">
      <span class="tenant-badge">{{ context.tenant.short_name }}</span>
      <form method="post" action="/logout"><button class="link-button" type="submit">Sign out</button></form>
    </div>
    {% endif %}
  </header>
  {% if context and context.user %}
  <nav class="nav" aria-label="Main navigation">
    <a href="/app">Dashboard</a>
    <a href="/orchids">Orchids</a>
    <a href="/locations">Locations</a>
  </nav>
  {% endif %}
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">CCE · Park City Orchids and More</footer>
</body>
</html>
