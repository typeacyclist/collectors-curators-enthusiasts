{% extends "base.html" %}
{% block title %}{{ title }} · PCO{% endblock %}
{% block content %}
<div class="page-heading"><div><p class="eyebrow">Orchid record</p><h1>{{ title }}</h1></div></div>
<form class="panel form-grid" method="post" action="{{ action }}">
  <label class="span-2">Orchid name<input name="display_name" required value="{{ orchid.display_name if orchid else '' }}" placeholder="Cymbidium Golden Elf ‘Sundust’"></label>
  <label>Collection<select name="collection_id" required>{% for collection in collections %}<option value="{{ collection.id }}" {% if orchid and orchid.collection_id == collection.id %}selected{% endif %}>{{ collection.name }}</option>{% endfor %}</select></label>
  <label>Location<select name="location_id"><option value="">No location</option>{% for location in locations %}<option value="{{ location.id }}" {% if orchid and orchid.location_id == location.id %}selected{% endif %}>{{ location.path }}</option>{% endfor %}</select></label>
  <label>Status<select name="status">{% for item in statuses %}<option value="{{ item }}" {% if orchid and orchid.status == item %}selected{% endif %}>{{ item|replace('_',' ')|title }}</option>{% endfor %}</select></label>
  <label>Genus<input name="genus" value="{{ orchid.genus if orchid and orchid.genus else '' }}" placeholder="Cymbidium"></label>
  <label>Species or grex<input name="species_grex" value="{{ orchid.species_grex if orchid and orchid.species_grex else '' }}" placeholder="Golden Elf"></label>
  <label>Cultivar or clone<input name="cultivar_clone" value="{{ orchid.cultivar_clone if orchid and orchid.cultivar_clone else '' }}" placeholder="Sundust"></label>
  <label>Source<input name="source_name" value="{{ orchid.source_name if orchid and orchid.source_name else '' }}" placeholder="Andy"></label>
  <label>Acquisition date<input name="acquisition_date" value="{{ orchid.acquisition_date if orchid and orchid.acquisition_date else '' }}" placeholder="July 2026"></label>
  <label>Purchase price<input name="purchase_price" inputmode="decimal" value="{{ orchid.purchase_price if orchid and orchid.purchase_price is not none else '' }}" placeholder="34.44"></label>
  <label class="span-2">Narrative<textarea name="narrative" rows="5" placeholder="Bought from Andy for $34.44. Good price, but it needs some TLC.">{{ orchid.narrative if orchid and orchid.narrative else '' }}</textarea></label>
  <div class="form-actions span-2"><a class="button secondary" href="{{ '/orchids/' + orchid.id if orchid else '/orchids' }}">Cancel</a><button class="button primary" type="submit">Save Orchid</button></div>
</form>
{% endblock %}
