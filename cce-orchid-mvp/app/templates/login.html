{% extends "base.html" %}
{% block title %}Sign in · Orchid Enthusiasts{% endblock %}
{% block content %}
<section class="panel narrow">
  <p class="eyebrow">Secure access</p>
  <h1>Sign in</h1>
  {% if auth_mode == "dev" %}
  <p>This development build uses the seeded PCO administrator.</p>
  <form method="post" action="/auth/dev-login"><button class="button primary full" type="submit">Continue as PCO Administrator</button></form>
  {% else %}
  <form id="identity-form" class="stack">
    <label>Email<input id="email" type="email" autocomplete="email" required></label>
    <label>Password<input id="password" type="password" autocomplete="current-password" required></label>
    <button class="button primary full" type="submit">Sign in</button>
    <p id="auth-error" class="error" hidden></p>
  </form>
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
    import { getAuth, signInWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
    const app = initializeApp({
      apiKey: {{ settings.firebase_api_key|tojson }},
      authDomain: {{ settings.firebase_auth_domain|tojson }},
      projectId: {{ settings.firebase_project_id|tojson }}
    });
    const auth = getAuth(app);
    document.getElementById('identity-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const error = document.getElementById('auth-error');
      error.hidden = true;
      try {
        const credential = await signInWithEmailAndPassword(auth, email.value, password.value);
        const idToken = await credential.user.getIdToken();
        const response = await fetch('/auth/session', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({idToken})});
        const result = await response.json();
        if (!response.ok) throw new Error(result.detail || 'Sign-in failed');
        location.href = result.redirect;
      } catch (e) {
        error.textContent = e.message;
        error.hidden = false;
      }
    });
  </script>
  {% endif %}
</section>
{% endblock %}
